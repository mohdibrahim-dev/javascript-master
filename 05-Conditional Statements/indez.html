<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Sign Up</title>
<link rel="stylesheet" href="css/style.css">
    
</head>

<body>





    <div class="card">
        <ul class="card-nav">
            <LI>
                <img src="logo.svg" />
                <span class="active-bar"></span>
            </li>
            <li>
                <button type="button" class="signin active" onclick="selectView('signin')">
                    <i class="at-person-check"></t>
                        <span>Sign In</span>
                </button>
            </li>
            <li>
                <button type="button" class="signup" onclick="selectView('signup')">
                    <i class="at-person-add"></i>
                    <span>Sign Up</span>
                </button>
            </li>
        </ul>
        <div class="card-hero">
            <div class="card-hero-inner">
                <div class="card-hero-content signin">
                    <div>
                        <h2>Welcome Back.</h2>
                        <h3>Please enter your credentials.</h3>
                    </div>
                    <img src="signin.svg" />
                </div>
                <div class="card-hero-content signup">
                    <div>
                        <h2>Sign Up Now.</h2>
                        <h3>Join the crowd and get started.</h3>
                    </div>
                    <img src="signup.svg" />
                </div>
            </div>
        </div>
        <div class="card-form">
            <div class="forms">
                <form id="signin" class="active">
                    <!-- form code on GitHub -->
                </form>
                <form id="signup">
                    <!-- form code on GitHub-->
                </form>
            </div>
        </div>
    </div>




<script src="js/"></script>
